<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c6cf0"/>
      <stop offset="100%" stop-color="#9b8cf5"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="28" fill="none" stroke="url(#g)" stroke-width="3"/>
  <circle cx="32" cy="32" r="4" fill="url(#g)">
    <animate attributeName="r" values="4;6;4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <line x1="32" y1="4" x2="32" y2="60" stroke="url(#g)" stroke-width="0.8" opacity="0.3"/>
  <line x1="4" y1="32" x2="60" y2="32" stroke="url(#g)" stroke-width="0.8" opacity="0.3"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="url(#g)" stroke-width="0.5" opacity="0.2" stroke-dasharray="4 4">
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="20s" repeatCount="indefinite"/>
  </circle>
</svg>
